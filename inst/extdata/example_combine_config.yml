# Example combine-mode YAML for MRManalyzeR.
#
# Usage:
#   library(MRManalyzeR)
#   runMRManalyzeRCombine("path/to/your_combine_config.yml")
#
# What this does:
#   1. Loads each entry under `combine.datasets:` (.RDS or .xlsx — both OK).
#   2. Optionally renames per-dataset QC IDs to a shared label and drops
#      QCs that aren't in the rename map.
#   3. Aligns variable_meta (feature metadata) across datasets — by default
#      uses the *intersection* of column names across inputs. Spell out
#      `feature_meta_cols` only if you want to *narrow* that set.
#   4. Same for sample_meta (`sample_meta_cols`).
#   5. Intersects samples by `Sample_ID`, cbind's data matrices, rbind's
#      variable_meta, and writes:
#         <output_stub>.RDS         — merged DatasetExperiment
#         <output_stub>.xlsx        — feature_metadata / sample_metadata / matrix
#         <output_stub>_stats.xlsx  — key / stats / correlations / linear_models
#         <output_stub>_stats_report.html
#
# PeakMatrixProcessing and the data_quality_report are NOT run in this mode.

# ============================== COMBINE =============================
combine:

  # -- inputs --
  datasets:
    - path: "D:/__STUDIES/021_HDM_mice/results/LC-MSMS/NormByArea/GOM_mouseSections_HDM_ng_mL_.RDS"
      tag:  "GOM"
      # Optional: rename QC sample IDs to a shared label across all panels.
      # QCs not listed here are dropped from this dataset.
      qc_remap: { "QC1": "QC_pooled" }
      # Optional: rename variable_meta columns BEFORE aligning across panels.
      # Format: { new_name: "old_name" }
      # feature_meta_rename: { Class: SubClass }

    - path: "D:/__STUDIES/021_HDM_mice/results/LC-MSMS/NormByArea/cysLT_mouseSections_HDM_ng_mL_.RDS"
      tag:  "cysLT"
      qc_remap: { "QC1": "QC_pooled" }

    - path: "D:/__STUDIES/021_HDM_mice/results/LC-MSMS/NormByArea/SPM_mouseSections_HDM_Response_.RDS"
      tag:  "SPM"
      # No qc_remap → QCs (matching ^QC) pass through unchanged

  # -- alignment (both default to the INTERSECTION of columns across inputs) --
  feature_meta_cols: ~     # narrow/re-order feature cols, e.g. [Compound, Class, Primary]
  sample_meta_cols:  ~     # narrow/re-order sample cols, e.g. [Sample_ID, Treatment, Sex]
  sample_id_col: Sample_ID # column matched across datasets
  drop_samples: []         # Sample_IDs to exclude from the merge
  duplicate_samples: error # error | first | mean | median - what to do when a
                           # dataset holds the same Sample_ID more than once
  prefix_features: True    # tag feature names (e.g. GOM__PGE2) to avoid collisions

  # -- output --
  combined_name: "HDM_combined"
  units:         "combined"     # value label for plot axes / report text
  output_stub:   "D:/__STUDIES/021_HDM_mice/results/LC-MSMS/Combined/HDM_combined"

# ========================= STATS REPORT ========================
# Same schema as the standard MRManalyzeR stats_report block.
stats_report:
  execute: True
  use_imputed: False                    # True = statistics on the merge of the
                                        # panels' imputed matrices; False = on
                                        # their _measured.RDS where stored

  # -- colours (shared by every plot in this report) --
  colours:
    qualitative: hat                    # hat | reading | heatmap0
    diverging:   heatmap2               # heatmap2 | heatmap0

  # -- general figure pars--
  fig_scale: 1                          # plot size multiplier
  interactive_plots: True               # hover tooltips | False = png
  yaxis_quant: 0.95                     # y-axis cap quantile
  yaxis_scalar: 1.3                     # 'headroom' scalar above yaxis_quant limit for plots

  # -- sample identification  (summary, boxplots, biological filter) --
  sample_type_head: Sample_type         # row-classifier column
  sample_labels: ["Sample"]             # biological value(s)
  # biological_filter defaults to sample_type_head in sample_labels; add `biological_filter: {head: ~}` to disable

  # -- analysis-wide --
  global_summary_factor: "Treatment"    # Primary study factor
  p_adjust: BH                          # BH (=fdr) | bonferroni
  sig_threshold: 0.05

  # -- comparisons  (method: is pre-specified per entry; see below) --
  comparisons:
    enabled: True
    entries:
      - name: Ctrl_vs_HDM
        method: welch                 # welch | student | wilcoxon (2 groups)
        compare: { factor: Treatment, levels: [Ctrl, HDM_Curdlan] }

  # -- boxplot  (per-compound by factor(s)) --
  boxplot:
    enabled: False

  # -- PCA per comparison --
  pca:
    enabled: True
    components: [1, 2]                 # which two PCs
    label: none                        # none | all | outliers
    label_factor: Sample_ID
    ellipse: group                     # none | group
    ellipse_confidence: 0.95
    loadings:
      enabled: True
      color_by: Primary                # feature_metadata column for bar fill
    preprocess:                        # PCA only
      feat_na_max:   1                 # 1 = keep all (allow up to 100% NA)
      sample_na_max: 1                 # 1 = keep all
      impute:      gaussian            # gaussian | frac_min | min | half_min | none
      seed:        42                  # random draws for gaussian
      impute_frac: 0.5
      transform:   log2                # none | log2 | sqrt
      center:      True
      scale:       True

  # -- volcano  (per 2-group comparison / Tukey pair) --
  volcano:
    enabled:      True
    use_adjusted: False                # False = raw p | True = BH
    top_n_label:  10                   # labelled features

  # -- heatmap  (samples x features) --
  heatmap:
    enabled:                True         # master switch for 4.5–4.7

    # -- shared render settings (inherited by general / top_changing / split_by_class) -- can override
    orientation:            samples_x    # samples_y | samples_x | auto
    color_samples_by:       Treatment    # sample annotation + 4.6 Global-tab ranking factor
    group_features_by:      Primary
    transform:              log2         # none | log2 | sqrt
    scale:                  z            # z | none  (ignored when style is group_means)
    style:                  auto         # auto | samples | group_means
                                         #   auto -> group_means at 3+ groups, samples at 2
    alpha_floor:            0.6          # group_means only: opacity of a non-contributing sample
    cluster_rows:           False
    cluster_within_groups:  True
    rank_by:                log2fc       # 4.6 comparison-tab ranking: p_adj | p_value | log2fc
    feature_labels:         small        # show | small | hide  (inherited default)
    cell_size:              auto         # auto | points (e.g. 10) - per-block overridable
    cell_aspect:            1.5          # max cell width:height when cell_size is auto (1 = square)

    general:                             # 4.5 — all features retained
      enabled: True
      scope:   all                       # global | comparisons | all

    top_changing:                        # 4.6 — top-N changing features per class
      enabled: False
      scope:   comparisons               # global | comparisons | all
      n_per_class: 10
      feature_labels: show               # override (focused subset -> show names)
      cell_aspect: 1                     # few features -> keep cells square

    split_by_class:                      # 4.7 — heatmap per / across class value(s)
      enabled: False
      scope:   global                    # global | comparisons | all
      subclass_col: Primary              # feature_metadata column to split by
      subclass_values: []                # focus values e.g. [COX, LOX]; empty = all
      multi_class: combined              # combined | tabs  (only matters for >1 value)
      feature_labels: show               # override (focused subset -> show names)
      cell_aspect: 1                     # few features -> keep cells square

  # -- ion ratios  (enzyme-activity surrogates) --
  # Compound names must include the dataset tag prefix when prefix_features: True
  # (e.g. "GOM__9(10)-EpOME").
  ion_ratios:
    enabled: False
    ratios:
      - num:   "GOM__9(10)-EpOME"
        den:   "GOM__9(10)-DiHOME"
        label: "EpOME/DiHOME (9,10)"

  # -- correlations  (pairwise feature x feature; one heatmap per subset x method) --
  correlations:
    enabled: True
    entries:
      - name: feature_pairs
        methods: [pearson, spearman]   # pearson | spearman
        subsets:
          - { Treatment: Ctrl }
          - { Treatment: HDM_Curdlan }
        cluster: True                  # cluster within pathway group
        show_values: False             # numbers in cells (busy >30 feat)
        include_self: False            # include feature-vs-self (diagonal)

  # -- linear models  (feature ~ formula; one row per coefficient) --
  linear_models:
    enabled: True
    entries:
      - name: treatment_x_sex
        formula: "~ Treatment * Sex"   # * = main effects + interaction
        subset: { Sample_type: Sample }
