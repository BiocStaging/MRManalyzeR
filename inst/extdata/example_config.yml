project: &general
  name: example-project
  researcher: Matthew J. Smith

  # See inst/extdata/example_combine_config.yml for the merge-multiple-
  # acquisitions workflow (runMRManalyzeRCombine()).
  #
  # Every `enabled:` and `execute:` below is True | False. A key with a list of
  # values after `#` takes one of those; anything else is a column name in the
  # metadata sheets, a number, or free text. An absent key means the step is
  # off, except where a default is stated.

  # ============================= PATHS =============================
  paths:
    project_dir: &project_dir 'C:/Users/matsmi/OneDrive - Karolinska Institutet/Dokument/Bioinformatics/MRManalyzeR'
    data_dir:    &data_dir    !concat_path [*project_dir, 'inst/extdata']
    result_dir:  &result_dir  !concat_path [*project_dir, 'temp_res']
    fn:          &fn example_data   # input .xlsx name (in data_dir), and the stem of every
                                    # output; with execute: False it must match the stored .RDS
    suffix: _                       # appended to output filenames
                                    # (datatype lives with the data source it applies to)

  # ==================== PEAK MATRIX PROCESSING ====================
  PeakMatrixProcessing:
    execute: True                  # False = skip processing and load the stored dataset:
                                   #   <result_dir>/<fn>_<datatype><suffix>.RDS
                                   # so fn, datatype and suffix must match that file.
                                   # If they don't, the error lists the .RDS files found.

    # 1. Data source  (enable EXACTLY ONE)
    #    The enabled block names the reported value, which tags every output
    #    filename: datatype: for tl_data / matrix_data, signal_filter: for
    #    skyline_data (a Skyline export has no units tag, so the LOD / LOQ
    #    floor is what separates one run from another). Either may be a list,
    #    which loops the whole workflow once per entry.
    skyline_data:
      enabled: False
      data_tab_names: [skyline_data]      # molecule x sample sheet(s)
      signal_filter: ["LOD"]              # LOD | LOQ | False - also the output label;
                                          # a list loops, e.g. ["LOD", "LOQ"]
    tl_data:
      enabled: True
      data_tab_names: [lcms_data]         # TargetLynx sheet(s); omit to auto-match 'lcms_data*'
      tl_headers: ["ID", "Name","Area", "ng/mL", "Response",  "S/N"]
      datatype: ["ng/mL"]                 # TargetLynx units tag; one of tl_headers -
                                          # a list loops, e.g. ["Area", "Response"]
      snr: 3                              # S/N threshold | False
    matrix_data:                          # vendor-neutral: any sample x analyte table
      enabled: False
      data_tab_names: [matrix_data]       # sheet(s) holding the matrix
      datatype: ["Area"]                  # output label (the matrix is already one value)
      id_col: ~                           # label column (not a measurement); ~ = first column.
                                          # samples_rows -> holds sample names; samples_cols ->
                                          # holds compound names. The other axis is the header row.
      orientation: samples_rows           # samples_rows | samples_cols. Get this wrong and the
                                          # run reports every feature and every sample as
                                          # unmatched rather than failing - watch the console.
      signal_filter: False                # LOD | LOQ | False (needs the column in feature_metadata)

    # 2. Sample metadata columns
    sample_meta_tab: sample_metadata      # sheet holding one row per injection
    name_col: Name                        # sample id (matches injection / matrix rows)
    include_col: Include                  # sample include-filter column
    include_value: "YES"                  # value marking rows to process

    # 3. Feature metadata columns
    feature_meta_tab: feature_metadata    # sheet holding one row per compound
    compound_col: Compound                # feature id
    processing_name_col: Processing_name  # raw feature name (joins to source)
    report_col: Report                    # feature include-filter column. Optional: if the
                                          # column is absent every feature is reported (with a
                                          # warning), which is normal for a feature table
                                          # curated outside a TargetLynx workflow.
    report_value: "YES"                   # value marking features to report
    comment_col: Comment                  # exclusion-reason column (optional)

    # 4. Blank filter
    blank_filter: False                   # nx > blank mean | False
    blank_head: 'Sample_type'             # column identifying blanks
    blank_name: 'Blank'                   # value marking blanks
    # 4b. Feature detection filter  (runs after the blank filter, before
    #     batch correction, normalisation and imputation; applied once to
    #     the whole dataset, never per batch)
    filter_features:
      enabled: False
      min_frac: 0.5              # keep a feature detected in >= this fraction
      method: within             # across | within | QC
                                 #   within - fraction per group_col level, best
                                 #            level wins, so a feature real in
                                 #            only one treatment survives
                                 #   across - one fraction over all study
                                 #            samples; deletes treatment-
                                 #            specific features, use with care
                                 #   QC     - fraction over QCs only; falls back
                                 #            to within if the run has no QCs
      group_col: Treatment       # 'within' only
      sample_col: Sample_type    # QCs and blanks never count towards the
      sample_labels: ["Sample"]  #   fraction, but are kept in the dataset
      qc_label: QC               # 'QC' only

    # 4c. Sample filter  (runs after 4b, on the reduced feature set, so the
    #     missing-value fraction is measured against features that are real)
    filter_samples:
      enabled: False
      max_na: 0.8                # drop a study injection missing > this fraction
      sample_col: Sample_type    # only study samples are ever removed; a QC or
      sample_labels: ["Sample"]  #   blank over the threshold is reported, kept


    # 5. Batch correction  (straight after the filters, on the instrument
    #    signal; before normalisation, adjustment and imputation. A missing
    #    value counts as zero in the batch medians)
    batch_correction: False               # False | True (every compound) | name of a
                                          # feature_metadata column of YES / NO
                                          # choosing which compounds to correct
    bc_qc_label: "Sample"                 # QC | Sample - QCs are safest; Sample assumes
                                          # the design is balanced across batches
    bc_check_factor: ~                   # study factor; warns if batch is confounded with it
    bc_factor_name: "Sample_type"         # column holding bc_qc_label
    bc_header: "Chrom_Batch"              # batch-label column
    processing_batch: ~                  # partitions the blank filter and imputation.
                                         # ~ = follow bc_header; if that column does not exist
                                         # the run warns and treats every sample as one batch.
                                         # Naming a column that does not exist is an error.
                                         # False = one batch, no warning (single-batch studies)

    # 6. Normalisation
    normalize: False                      # False | sample_metadata column to divide by

    # 7. Concentration adjustment  (conc * cal_vol/sample_vol * sample_IS/cal_IS, then * sample_vol/starting_vol)
    adjust_conc:
      enabled: False                      # on/off
      starting_vol_col: False             # False to skip this step | column of pre-dry-down volume
      sample_vol_col:   "sample_volume_uL"  # sample_metadata columns holding the
      cal_vol_col:      "cal_vol_uL"        #   vial volume and the internal-standard
      sample_IS_col:    "sample_IS_vol_uL"  #   volume, for the sample and for the
      cal_IS_col:       "cal_IS_vol_uL"     #   calibrant

    # 8. Missing-value imputation  (last)
    replace_MVs: 0.2                      # False | fraction of the per-feature minimum
                                          # (e.g. 0.2) used as the fill ceiling. Set, it
                                          # imputes the output matrix (xlsx 'matrix', RDS)
                                          # and adds 'matrix_measured'; the reports still
                                          # use measured values unless use_imputed: True.
                                          # The PCAs use these values too.
                                          # False: nothing imputed except inside PCA.
    impute_method: gaussian               # gaussian = random draws in (0, ceiling), normal
                                          # centred mid-range | constant = the ceiling
    impute_seed: 42                       # same seed, same fills on every rerun

    # 9. Output
    scale_fac: 1                          # multiply outputs (e.g. 1000: ng/mL -> pg/mL)
    # units: ["ng/mL"]                    # optional value label (else datatype)

  # ===================== DATA QUALITY REPORT =====================
  data_quality_report:
    execute: True
    use_imputed: False                    # True = CVs and plots on the replace_MVs
                                          # matrix; False = measured values

    # -- colours (shared by every plot in this report) --
    colours:
      # levels: pin a class to one colour wherever it is drawn - heatmap
      #   annotation, PCA loadings, correlation blocks. Unlisted levels
      #   take the palette below.
      # levels:
      #   COX: "#B03A2E"
      #   LOX: "#CA6F1E"
      qualitative: hat                    # hat | reading | heatmap0 - group / class colours
                                          # hat order: blue, red, green, yellow, purple,
                                          # teal, crimson, light green, orange, grey
      diverging:   heatmap2               # heatmap2 | heatmap0 - z-scores and correlations

    # -- general figure pars--
    fig_scale: 1                          # plot size multiplier
    interactive_plots: True               # hover tooltips | False = png
    yaxis_quant: 0.95                     # y-axis cap quantile
    yaxis_scalar: 1.3                     # 'headroom' scalar above yaxis_quant limit for plots

    # -- sample identification  (summary, CVs, drift, Q-Q, PCA) --
    sample_type_head: Sample_type         # row-classifier column
    qc_label: QC                          # QC value(s) = CV_QC
    sample_labels: ["Sample"]             # biological value(s) = CV_sample
    injection_order_head: Injection_order # drift-plot x-axis; drives QC-PCA numeric colour scale
    sample_id_head: Sample_ID             # per-sample id for hover / labels
    # intensity_plot_levels: [QC, Sample] # which sample types appear in the drift / Q-Q
                                          # plots; default = qc_label + sample_labels

    # -- intensity vs injection order (drift) --
    plot_intensity_per_compound: True     # True | False

    # -- Q-Q normality (same subset as drift) --
    plot_qq_per_compound: True            # True | False
    qq_transform: [none, log2, sqrt]      # none | log2 | sqrt (one tab each)

    # -- QC PCA  (one per color_by factor) --
    qc_pca:
      enabled: True
      color_by: [Injection_order, Chrom_Batch, Sample_type]  # one PCA each
      label:   none                       # none | all | outliers
      label_factor: Sample_ID             # sample_metadata column for point labels
      ellipse: none                       # none | group
      preprocess:                         # PCA only
        feat_na_max:   0.6                # drop features >60% missing
        sample_na_max: 0.6                # drop samples >60% missing
        impute:      gaussian             # gaussian | frac_min | min | half_min | none
                                          # fills what replace_MVs left missing
        seed:        42                   # random draws for gaussian
        impute_frac: 0.2                  # ceiling = this x the feature's minimum
        transform:   log2                 # none | log2 | sqrt
        center:      True                 # True | False
        scale:       True                 # True | False - unit variance per feature

  # ========================= STATS REPORT ========================
  stats_report:
    execute: True
    use_imputed: False                    # True = tests and plots on the replace_MVs
                                          # matrix; False = measured values. The PCA
                                          # uses the replace_MVs values either way.

    # -- colours (shared by every plot in this report) --
    colours:
      # levels: pin a class to one colour wherever it is drawn - heatmap
      #   annotation, PCA loadings, correlation blocks. Unlisted levels
      #   take the palette below.
      # levels:
      #   COX: "#B03A2E"
      #   LOX: "#CA6F1E"
      qualitative: hat                    # hat | reading | heatmap0 - group / class colours
                                          # hat order: blue, red, green, yellow, purple,
                                          # teal, crimson, light green, orange, grey
      diverging:   heatmap2               # heatmap2 | heatmap0 - z-scores and correlations

    # -- general figure pars--
    fig_scale: 1                          # plot size multiplier
    interactive_plots: True               # hover tooltips | False = png
    yaxis_quant: 0.95                     # y-axis cap quantile
    yaxis_scalar: 1.3                     # 'headroom' scalar above yaxis_quant limit for plots

    # -- sample identification  (summary, boxplots, biological filter) --
    sample_type_head: Sample_type         # row-classifier column
    sample_labels: ["Sample"]             # biological value(s)
    sample_id_head: Sample_ID             # per-sample id for hover / heatmap rows
    # biological_filter drops blanks / QCs from the global summary and global PCA.
    # Defaults to sample_type_head in sample_labels; `biological_filter: {head: ~}` disables it.

    # -- analysis-wide --
    global_summary_factor: "Treatment"    # Primary study factor
    p_adjust: BH                          # BH (=fdr) | bonferroni
    sig_threshold: 0.05                   # alpha for the significance flags

    # -- comparisons  (method: is pre-specified per entry; see below) --
    comparisons:
      enabled: True
      entries:
        - name: Ctrl_vs_HDM_in_WT
          method: welch                 # welch | student | wilcoxon (2 groups)
          subset: { Type: WT }
          compare: { factor: Treatment, levels: [PBS, HDM] }
        - name: Ctrl_vs_HDM_in_KO
          method: welch                 # welch | student | wilcoxon (2 groups)
          subset: { Type: KO }
          compare: { factor: Treatment, levels: [PBS, HDM] }
        # Paired designs (pre/post, matched tissues, same animal twice):
        # - name: pre_vs_post
        #   method: welch
        #   paired: true
        #   subject: Animal_ID          # column linking the two observations
        #   compare: { factor: TimePoint, levels: [pre, post] }

    # -- boxplot  (per-compound by factor(s)) --
    boxplot:
      enabled: True
      factors: [Treatment, Type]          # sample_metadata columns, one tab each
      display: tabs                       # combined | tabs
      plot_type: both                     # box | bar | both
      error_bar: SD                       # SD | SE | none
      # levels: ["Sample"]                # rows included; default = sample_labels

    # -- PCA per comparison --
    pca:
      enabled: True
      components: [1, 2]                 # which two PCs
      label: none                        # none | all | outliers
      label_factor: Sample_ID            # sample_metadata column for point labels
      ellipse: group                     # none | group
      ellipse_confidence: 0.95           # 0-1
      loadings:
        enabled:  True
        color_by: Enzymatic_pathway      # feature_metadata column for bar fill
      preprocess:                        # PCA only
        feat_na_max:   0.6               # drop features >60% missing
        sample_na_max: 0.6               # drop samples >60% missing
        impute:      gaussian            # gaussian | frac_min | min | half_min | none
                                         # fills what replace_MVs left missing
        seed:        42                  # random draws for gaussian
        impute_frac: 0.2                 # ceiling = this x the feature's minimum
        transform:   log2                # none | log2 | sqrt
        center:      True                # True | False
        scale:       True                # True | False - unit variance per feature

    # -- volcano  (per 2-group comparison / Tukey pair) --
    volcano:
      enabled:      True
      use_adjusted: False                # False = raw p | True = BH
      top_n_label:  10                   # labelled features

    # -- heatmap  (samples x features) --
    heatmap:
      enabled:                True         # master switch for 4.5–4.7

      # -- shared render settings (inherited by general / top_changing / split_by_class) -- can override
      orientation:            samples_x    # samples_y | samples_x | auto
      color_samples_by:       Treatment    # sample annotation + 4.6 Global-tab ranking factor
      group_features_by:      Enzymatic_pathway   # feature_metadata column
      transform:              log2         # none | log2 | sqrt
      scale:                  z            # z | none  (ignored when style is group_means)
      style:                  auto         # auto | samples | group_means
                                           #   auto -> group_means at 3+ groups, samples at 2
      alpha_floor:            0.6          # group_means only: opacity of a non-contributing sample
      cluster_rows:           False        # True | False - cluster the feature axis
      cluster_within_groups:  True         # True | False - cluster inside each block,
                                           #   so the blocks stay together
      rank_by:                log2fc       # 4.6 comparison-tab ranking: p_adj | p_value | log2fc
      feature_labels:         hide         # show | small | hide  (inherited default)
                                           #   under group_means the names are drawn
                                           #   between the class bar and the cells
      cell_size:              auto         # auto | points (e.g. 10) - per-block overridable
      cell_aspect:            1.5          # max cell width:height when cell_size is auto (1 = square)

      general:                             # 4.5 — all features retained
        enabled: True
        scope:   all                       # global | comparisons | all
        # feature_labels: small            # optional per-block override (any shared setting)

      top_changing:                        # 4.6 — top-N changing features per class
        enabled: True
        scope:   all                       # global | comparisons | all
        n_per_class: 5                     # features kept per class
        # rank_by: p_value                 # optional override of the root rank_by
        feature_labels: show               # override (focused subset -> show names)
        cell_aspect: 1                     # few features -> keep cells square

      split_by_class:                      # 4.7 — heatmap per / across class value(s)
        enabled: True
        scope:   all                       # global | comparisons | all
        subclass_col: Enzymatic_pathway    # feature_metadata column to split by
        subclass_values: [COX, LOX]        # focus values; empty = all
        multi_class: combined              # combined | tabs  (only matters for >1 value)
        feature_labels: show               # override (focused subset -> show names)
        cell_aspect: 1                     # few features -> keep cells square

    # -- ion ratios  (enzyme-activity surrogates) --
    ion_ratios:
      enabled: True
      ratios:
        - num:   "13,14-dihydro-15-keto-PGE2"
          den:   "PGE2"
          label: "13,14-dihydro-15-keto-PGE2 -- PGE2 ratio"

    # -- correlations  (pairwise feature x feature; one heatmap per subset x method) --
    correlations:
      enabled: True
      entries:
        - name: feature_pairs
          methods: [spearman]            # pearson | spearman
          subsets:
            - { }                        # all samples
          cluster: True                  # cluster within pathway group
          show_values: False             # numbers in cells (busy >30 feat)
          include_self: False            # include feature-vs-self (diagonal)

    # -- linear models  (feature ~ formula; one row per coefficient) --
    linear_models:
      enabled: True
      entries:
        - name: type_adjusted_treatment
          formula: "~ Treatment + type"  # additive (main effects only)
          subset: { Sample_type: Sample }
